[package]
name = "anvil"
version = "0.1.0"
edition = "2021"
description = "Native Android application development toolkit"
license = "MIT"

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
